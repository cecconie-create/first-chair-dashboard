<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First Chair | Property Dashboard</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#203040;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}header{background:#16364b;color:white;padding:19px 25px;display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{font-size:21px;margin:0}header small{color:#b6d6e0}button{background:#167d82;color:white;border:0;border-radius:8px;padding:10px 13px;cursor:pointer;font-weight:600}button:hover{filter:brightness(.93)}button:disabled{opacity:.5;cursor:wait}.outline{background:white;color:#176f76;border:1px solid #c8d5df}.danger{background:#fff0ee;color:#9e3c33}.layout{display:grid;grid-template-columns:275px 1fr;min-height:calc(100vh - 70px)}aside{background:#fff;border-right:1px solid #dce5ea;padding:18px;overflow:auto}main{padding:25px;min-width:0;max-width:1150px;width:100%;margin:0 auto;align-self:start}input,textarea,select{border:1px solid #cbd7de;border-radius:8px;padding:10px;font:inherit;width:100%;background:white}textarea{min-height:90px}label{display:block;font-size:12px;font-weight:700;color:#60727e;margin:0 0 5px}.field{margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}.wide{grid-column:1/-1}.unit{width:100%;background:transparent;color:#263f4c;text-align:left;border-radius:7px;margin:3px 0;padding:11px}.unit:hover,.unit.active{background:#e3f2f2}.unit small{display:block;color:#637681;margin-top:4px;font-weight:400}.panel{background:white;border:1px solid #dde7ed;border-radius:13px;padding:24px;margin-top:18px;box-shadow:0 3px 14px #2030400a}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:21px}.tab{background:#e7edf1;color:#435b67}.tab.active{background:#167d82;color:white}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.muted{color:#647781;font-size:13px}.entry{border:1px solid #dce5ea;border-radius:10px;padding:15px;margin:12px 0;white-space:pre-wrap}.entry p{white-space:pre-wrap}.pill{display:inline-block;background:#e6f2f2;color:#0d6a6b;padding:5px 9px;border-radius:12px;font-size:12px}.notice{background:#fff8e8;border:1px solid #f0dfb3;border-radius:8px;padding:12px;margin:15px 0;color:#655129;font-size:13px}.login{max-width:430px;margin:9vh auto;background:white;padding:35px;border-radius:14px;box-shadow:0 12px 35px #233b4b15}.login h2{margin-top:0}.hidden{display:none!important}#message{margin:10px 0;color:#176f76;min-height:18px}#error{color:#a43c37;white-space:pre-wrap}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.modalbg{position:fixed;inset:0;background:#122c3ba8;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:white;padding:25px;border-radius:12px;max-width:600px;width:100%;max-height:90vh;overflow:auto}.status{font-size:12px;color:#687d87} @media(max-width:800px){.layout{grid-template-columns:1fr}aside{max-height:240px;border-right:0;border-bottom:1px solid #ddd}.grid{grid-template-columns:1fr}main{padding:13px}.panel{padding:16px}}
</style></head><body><header><div><h1>FIRST CHAIR <span style="font-weight:400">/ Property Dashboard</span></h1><small>Private management workspace</small></div><div class="toolbar"><span id="connection" class="status"></span><button class="outline hidden" id="logout">Sign out</button></div></header>
<section id="login" class="login"><h2>Welcome back</h2><p class="muted">Sign in with the account you created in Supabase Authentication.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="signin">Sign in</button><p id="error"></p></section>
<div id="app" class="layout hidden"><aside><input id="search" placeholder="Search unit code or address"><div class="row"><h3>Properties</h3><span id="count" class="muted"></span></div><div id="units"></div><div class="notice">Changes are saved to your private Supabase database. Internet is required to edit records in this version.</div></aside><main><div class="row"><div><h2 id="title" style="margin-bottom:5px"></h2><div id="address" class="muted"></div></div><div class="toolbar"><button id="import" class="outline hidden">Import initial 40 properties</button><button id="refresh" class="outline">Refresh</button></div></div><div id="message"></div><div id="tabs" class="tabs"></div><div class="panel" id="content"></div></main></div><div id="modal" class="modalbg hidden"><div class="modal"><h3 id="modalTitle"></h3><div id="modalFields"></div><div class="toolbar"><button id="modalSave">Save</button><button id="modalCancel" class="outline">Cancel</button></div></div></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const URL='https://bnidrvikyclxjafsoajm.supabase.co',KEY='sb_publishable_Kn7rgwYKqEuYO0W89UUFpg_2rjHH-pa';
const db=createClient(URL,KEY),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,properties=[],current=null,tab='Property',cache={},modalAction=null;
const tables=['properties','property_access','property_details','contractors','property_notes','property_projects','property_documents'];
const defs={properties:[['address','Property address'],['owner_name','Owner name'],['owner_phone','Owner phone'],['owner_email','Owner email'],['helpful_information','Helpful information','textarea']],property_access:[['electronic_door_lock','Electronic door lock / code'],['garage_code','Garage code'],['backup_lockbox','Backup lockbox / code'],['physical_keys','Keys'],['parking_details','Parking / garage / passes','textarea'],['additional_notes','Access instructions','textarea']],property_details:[['wifi_network','Wi-Fi network'],['wifi_password','Wi-Fi password'],['appliances','Appliances','textarea'],['television','Television / streaming','textarea'],['fireplace','Fireplace','textarea'],['other_details','Other property details','textarea']],contractors:[['category','Category (Housekeeping, HOA, Plumber, etc.)'],['company_name','Company name'],['contact_name','Contact'],['phone','Phone'],['email','Email'],['notes','Notes','textarea']],property_notes:[['body','Note','textarea']],property_projects:[['title','Project title'],['description','Description','textarea'],['status','Status','status'],['due_date','Follow-up date','date']],property_documents:[['title','Document title'],['file_path','File location / link'],['description','Description','textarea']]};
const tabs=['Property','Access','Wi-Fi & Details','Contractors & HOA','Notes & Projects','Documents'];
const tbl=t=>({'Property':'properties','Access':'property_access','Wi-Fi & Details':'property_details','Contractors & HOA':'contractors','Notes & Projects':'property_notes','Documents':'property_documents'}[t]);
function msg(s,bad=false){$('message').style.color=bad?'#ad3b37':'#167d82';$('message').textContent=s;setTimeout(()=>{if($('message').textContent===s)$('message').textContent=''},6500)}
function check(res){if(res.error)throw res.error;return res.data}
async function load(){properties=check(await db.from('properties').select('*').order('unit_code'));if(!properties.some(p=>p.id===current))current=properties[0]?.id||null;cache={};$('import').classList.toggle('hidden',properties.length!==0);$('count').textContent=properties.length;await select(current)}
function listing(){const q=$('search').value.toLowerCase();$('units').innerHTML=properties.filter(p=>(p.unit_code+' '+p.address).toLowerCase().includes(q)).map(p=>`<button class="unit ${p.id===current?'active':''}" data-id="${p.id}"><b>${esc(p.unit_code)}</b><small>${esc(p.address)}</small></button>`).join('');document.querySelectorAll('.unit').forEach(b=>b.onclick=()=>select(b.dataset.id))}
async function select(id){current=id;listing();if(!id){$('title').textContent='Your dashboard is ready';$('address').textContent='Import your initial property directory from a private local file to get started.';$('tabs').innerHTML='';$('content').innerHTML='<p>Use the Import button above and select the private property import file on your computer. Do not upload that file to your public website.</p>';return}const p=properties.find(x=>x.id===id);$('title').textContent=p.unit_code;$('address').textContent=p.address;await switchTab(tab)}
async function switchTab(t){tab=t;$('tabs').innerHTML=tabs.map(x=>`<button class="tab ${x===tab?'active':''}" data-tab="${esc(x)}">${esc(x)}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));await render()}
async function render(){if(!current)return;const t=tbl(tab),p=properties.find(x=>x.id===current);$('content').innerHTML='Loading…';try{if(t==='properties'){drawForm(t,p);return}if(tab==='Notes & Projects'){const [a,b]=await Promise.all([db.from('property_notes').select('*').eq('property_id',current).order('created_at',{ascending:false}),db.from('property_projects').select('*').eq('property_id',current).order('created_at',{ascending:false})]);cache.property_notes=check(a);cache.property_projects=check(b);$('content').innerHTML=`<div class="row"><h3>Activity notes</h3><button data-new="property_notes">+ Add note</button></div><p class="muted">Every note receives an automatic timestamp when saved. Newest first.</p>${cards('property_notes',cache.property_notes)}<div class="row" style="margin-top:26px"><h3>Maintenance & projects</h3><button data-new="property_projects">+ Add project</button></div>${cards('property_projects',cache.property_projects)}`;bindCards();return}if(t==='property_access'||t==='property_details'){const rows=check(await db.from(t).select('*').eq('property_id',current).limit(1));cache[t]=rows;drawForm(t,rows[0]||{});return}const rows=check(await db.from(t).select('*').eq('property_id',current).order('created_at',{ascending:false}));cache[t]=rows;$('content').innerHTML=`<div class="row"><h3>${esc(tab)}</h3><button data-new="${t}">+ Add ${t==='contractors'?'contractor':'document reference'}</button></div>${t==='property_documents'?'<p class="muted">This tab saves document links or filenames. File uploads will be added separately.</p>':''}${cards(t,rows)}`;bindCards()}catch(e){$('content').textContent='Unable to load: '+e.message}}
function cards(t,rows){return rows.length?rows.map(x=>`<div class="entry"><div class="row"><b>${esc(x.title||x.company_name||x.body||'Record')}</b><span class="pill">${esc(x.status||x.category||'')}</span></div>${x.created_at?`<div class="muted">${new Date(x.created_at).toLocaleString('en-US',{timeZone:'America/Denver',dateStyle:'medium',timeStyle:'short'})}</div>`:''}<p>${esc(x.description||x.notes||x.file_path||'')}</p>${x.due_date?`<p class="muted">Follow-up: ${esc(x.due_date)}</p>`:''}<div class="toolbar"><button class="outline" data-edit="${t}" data-id="${x.id}">Edit</button><button class="danger" data-delete="${t}" data-id="${x.id}">Delete</button></div></div>`).join(''):'<p class="muted">Nothing recorded yet.</p>'}
function bindCards(){document.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>edit(b.dataset.new));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit,cache[b.dataset.edit].find(x=>x.id===b.dataset.id)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete,b.dataset.id))}
function inputs(t,record){return defs[t].map(([k,label,type])=>`<div class="field ${type==='textarea'?'wide':''}"><label>${esc(label)}</label>${type==='textarea'?`<textarea data-field="${k}">${esc(record[k])}</textarea>`:type==='status'?`<select data-field="${k}">${['Open','In Progress','On Hold','Completed'].map(v=>`<option ${record[k]===v?'selected':''}>${v}</option>`).join('')}</select>`:`<input data-field="${k}" type="${type==='date'?'date':'text'}" value="${esc(record[k])}">`}</div>`).join('')}
function drawForm(t,record){$('content').innerHTML=`<h3>${esc(tab)}</h3>${t==='property_access'?'<div class="notice">Access codes are sensitive. Sign out when using a shared device. Offline code storage is not enabled.</div>':''}<div class="grid">${inputs(t,record)}</div><button id="saveFields">Save changes</button>`;$('saveFields').onclick=async()=>{const data=values();try{if(t==='properties'){check(await db.from(t).update(data).eq('id',current));Object.assign(properties.find(x=>x.id===current),data);listing()}else{check(await db.from(t).upsert({...data,user_id:user.id,property_id:current,...(record.id?{id:record.id}:{})},{onConflict:'property_id'}))}msg('Saved successfully');await render()}catch(e){msg('Save failed: '+e.message,true)}}}
function values(root=document){const d={};root.querySelectorAll('[data-field]').forEach(el=>d[el.dataset.field]=el.value||null);return d}
function edit(t,record={}){modalAction={t,record};$('modalTitle').textContent=(record.id?'Edit ':'Add ')+t.replace('property_','').replace('_',' ');$('modalFields').innerHTML=inputs(t,record);$('modal').classList.remove('hidden')}
$('modalCancel').onclick=()=>$('modal').classList.add('hidden');$('modalSave').onclick=async()=>{const {t,record}=modalAction;const data=values($('modalFields'));if(t==='property_notes'&&!data.body){alert('Enter a note.');return}if(t==='property_projects'&&!data.title){alert('Enter a project title.');return}try{const payload={...data,user_id:user.id,property_id:current};if(record.id)payload.id=record.id;if(t==='property_projects'){payload.due_date=data.due_date||null;if(data.status==='Completed'&&record.status!=='Completed')payload.completed_at=new Date().toISOString();if(data.status!=='Completed')payload.completed_at=null}check(await db.from(t).upsert(payload));$('modal').classList.add('hidden');msg('Saved successfully');await render()}catch(e){alert('Save failed: '+e.message)}};
async function remove(t,id){if(!confirm('Delete this entry permanently?'))return;try{check(await db.from(t).delete().eq('id',id));await render();msg('Entry deleted')}catch(e){msg(e.message,true)}}
$('signin').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('error').textContent=error.message;return}await start()};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('refresh').onclick=load;$('search').oninput=listing;
async function start(){const {data:{user:u}}=await db.auth.getUser();if(!u)return;user=u;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('connection').textContent='Connected';try{await load()}catch(e){msg('Unable to load properties: '+e.message,true)}}
$('import').onclick=async()=>{if(properties.length)return;if(!confirm('Import the 40 property records from your original spreadsheet? Select your private property import file from your computer. The file will not be hosted publicly.'))return;try{const file=await new Promise((resolve,reject)=>{const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>input.files?.[0]?resolve(input.files[0]):reject(Error('No file selected'));input.click()});const seed=JSON.parse(await file.text());if(!Array.isArray(seed))throw Error('Invalid import file');const rows=seed.map(p=>({user_id:user.id,unit_code:p.code.trim(),address:p.address,owner_name:p.owner,owner_phone:p.phone,owner_email:p.email,helpful_information:[p.info,p.extra,p.status!=='Active'?p.status:''].filter(Boolean).join('\n')}));check(await db.from('properties').upsert(rows,{onConflict:'user_id,unit_code'}));const saved=check(await db.from('properties').select('id,unit_code'));const byCode=Object.fromEntries(saved.map(x=>[x.unit_code,x.id]));const contractors=seed.filter(p=>p.housekeeping&&!/terminat/i.test(p.housekeeping)).map(p=>({user_id:user.id,property_id:byCode[p.code.trim()],category:'Housekeeping',company_name:p.housekeeping,phone:p.housekeepingPhone||''}));if(contractors.length)check(await db.from('contractors').insert(contractors));msg('Property directory imported successfully');await load()}catch(e){msg('Import error: '+e.message,true)}};
const {data:{session}}=await db.auth.getSession();if(session)await start();
</script></body></html>
